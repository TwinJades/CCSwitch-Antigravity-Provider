[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ccswitch-antigravity-provider"
version = "0.0.0"
description = "Local Antigravity provider bridge for CC Switch"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = [
    "alembic>=1.19,<2",
    "argon2-cffi>=25,<26",
    "bcrypt>=5,<6",
    "fastapi>=0.140,<1",
    "httpx>=0.28,<1",
    "sqlalchemy>=2.0.52,<2.1",
    "uvicorn>=0.52,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=9.1,<10",
]
package = [
    "pyinstaller>=6.15,<7",
]

[project.scripts]
ccswitch-antigravity-provider = "ai_provider_gateway.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
